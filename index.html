<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelDrop — Tải & Lưu Ảnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #c8f135;
    --accent2: #a8d420;
    --text: #f0f0ee;
    --muted: #888890;
    --danger: #ff4d6d;
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .stats-bar {
    display: flex;
    gap: 1.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .stats-bar strong { color: var(--text); font-weight: 500; }

  /* ── Main layout ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── Drop zone ── */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: var(--surface);
    position: relative;
    margin-bottom: 2rem;
  }

  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: #1a1f0a;
  }

  .dropzone.drag-over::after {
    content: 'Thả ảnh vào đây!';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(200,241,53,0.08);
    border-radius: calc(var(--radius) - 2px);
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    pointer-events: none;
  }

  .drop-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1e2a08;
    border: 1px solid #3a520f;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
  }

  .drop-icon svg { width: 28px; height: 28px; color: var(--accent); }

  .dropzone h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  .dropzone p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
  }

  .btn-upload {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    padding: 0.65rem 1.5rem;
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }

  .btn-upload:hover { background: var(--accent2); transform: scale(1.03); }
  .btn-upload:active { transform: scale(0.97); }

  #fileInput { display: none; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
  }

  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .toolbar-right { display: flex; gap: 0.5rem; }

  .btn-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.45rem 0.9rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ── Grid ── */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  /* ── Image card ── */
  .img-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    animation: fadeIn 0.35s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .img-card:hover { transform: translateY(-3px); border-color: #444; }

  .img-card.selected { border-color: var(--accent); }

  .img-thumb {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    cursor: pointer;
    background: var(--surface2);
  }

  .img-info {
    padding: 0.65rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .img-name {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .img-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
  }

  .icon-btn:hover { background: var(--surface2); }
  .icon-btn.dl:hover { color: var(--accent); }
  .icon-btn.rm:hover { color: var(--danger); }

  /* ── Empty state ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .empty svg { margin: 0 auto 0.75rem; display: block; opacity: 0.3; }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: all;
  }

  .lightbox-img {
    max-width: min(90vw, 900px);
    max-height: 85vh;
    border-radius: var(--radius);
    object-fit: contain;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    transform: scale(0.92);
    transition: transform 0.25s;
  }

  .lightbox.open .lightbox-img { transform: scale(1); }

  .lightbox-close {
    position: fixed;
    top: 1.2rem;
    right: 1.5rem;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .lightbox-close:hover { background: rgba(255,255,255,0.2); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 1.2rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    z-index: 1000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 300px;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--accent); }
  .toast.error   { border-color: var(--danger); }

  /* ── Progress bar ── */
  .progress-wrap {
    background: var(--surface2);
    border-radius: 999px;
    height: 4px;
    margin-top: 1rem;
    overflow: hidden;
    display: none;
  }

  .progress-wrap.active { display: block; }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s;
    width: 0%;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 1rem; }
    .stats-bar { display: none; }
    main { padding: 1.25rem 1rem 3rem; }
    .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Pixel<span>Drop</span></div>
  <div class="stats-bar">
    <span>Ảnh: <strong id="hdrCount">0</strong></span>
    <span>Dung lượng: <strong id="hdrSize">0 KB</strong></span>
  </div>
</header>

<main>
  <!-- Drop zone -->
  <div class="dropzone" id="dropzone">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
    </div>
    <h2>Kéo & thả ảnh vào đây</h2>
    <p>Hỗ trợ JPG, PNG, GIF, WebP — nhiều file cùng lúc</p>
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      Chọn ảnh từ máy
    </button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <!-- Gallery toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="section-title">Thư viện ảnh</span>
      <span class="count-badge" id="countBadge">0 ảnh</span>
    </div>
    <div class="toolbar-right">
      <button class="btn-sm" onclick="downloadAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Tải tất cả
      </button>
      <button class="btn-sm danger" onclick="clearAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Xóa tất cả
      </button>
    </div>
  </div>

  <!-- Gallery grid -->
  <div class="gallery" id="gallery">
    <div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Chưa có ảnh nào. Hãy tải lên ảnh đầu tiên!
    </div>
  </div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="Xem ảnh">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'pixeldrop_images';
let images = [];

/* ── Load from localStorage ── */
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    images = raw ? JSON.parse(raw) : [];
  } catch { images = []; }
  render();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(images)); }
  catch { toast('Bộ nhớ đầy, không thể lưu thêm ảnh!', 'error'); }
}

/* ── Toast ── */
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 3000);
}

/* ── Format size ── */
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

/* ── Render ── */
function render() {
  const gallery = document.getElementById('gallery');
  const totalSize = images.reduce((s, i) => s + (i.size || 0), 0);

  document.getElementById('countBadge').textContent = images.length + ' ảnh';
  document.getElementById('hdrCount').textContent = images.length;
  document.getElementById('hdrSize').textContent = fmtSize(totalSize);

  if (!images.length) {
    gallery.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Chưa có ảnh nào. Hãy tải lên ảnh đầu tiên!
    </div>`;
    return;
  }

  gallery.innerHTML = images.map((img, i) => `
    <div class="img-card" id="card-${i}" style="animation-delay:${Math.min(i*0.04,0.4)}s">
      <img class="img-thumb" src="${img.data}" alt="${img.name}" loading="lazy"
           onclick="openLightbox('${img.data}')" title="Nhấp để xem to">
      <div class="img-info">
        <span class="img-name" title="${img.name}">${img.name}</span>
        <div class="img-actions">
          <button class="icon-btn dl" onclick="downloadOne(${i})" title="Tải xuống">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="icon-btn rm" onclick="removeOne(${i})" title="Xóa">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

/* ── Upload files ── */
function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) { toast('Chỉ hỗ trợ file ảnh!', 'error'); return; }

  let done = 0;
  const pw = document.getElementById('progressWrap');
  const pb = document.getElementById('progressBar');
  pw.classList.add('active');

  arr.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      images.unshift({ name: file.name, data: e.target.result, size: file.size, date: Date.now() });
      done++;
      pb.style.width = (done / arr.length * 100) + '%';
      if (done === arr.length) {
        save(); render();
        toast(`Đã tải lên ${arr.length} ảnh!`);
        setTimeout(() => { pw.classList.remove('active'); pb.style.width = '0%'; }, 800);
      }
    };
    reader.readAsDataURL(file);
  });
}

/* ── Download ── */
function downloadOne(i) {
  const img = images[i];
  const a = document.createElement('a');
  a.href = img.data;
  a.download = img.name;
  a.click();
  toast('Đang tải xuống: ' + img.name);
}

function downloadAll() {
  if (!images.length) { toast('Không có ảnh để tải!', 'error'); return; }
  images.forEach((img, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = img.data; a.download = img.name; a.click();
    }, i * 300);
  });
  toast('Đang tải xuống ' + images.length + ' ảnh...');
}

/* ── Remove ── */
function removeOne(i) {
  images.splice(i, 1);
  save(); render();
  toast('Đã xóa ảnh.');
}

function clearAll() {
  if (!images.length) return;
  if (!confirm(`Xóa tất cả ${images.length} ảnh? Không thể hoàn tác!`)) return;
  images = [];
  save(); render();
  toast('Đã xóa tất cả ảnh.');
}

/* ── Lightbox ── */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  if (!e || e.target !== document.getElementById('lightboxImg')) {
    document.getElementById('lightbox').classList.remove('open');
    setTimeout(() => { document.getElementById('lightboxImg').src = ''; }, 300);
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ── Drag & drop ── */
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));

/* ── Paste support ── */
document.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const imgs = items.filter(i => i.type.startsWith('image/'));
  if (imgs.length) handleFiles(imgs.map(i => i.getAsFile()));
});

/* ── Init ── */
load();
</script>
</body>
</html>
